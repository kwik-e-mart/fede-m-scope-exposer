steps:
  - name: "find k8s namespace"
    type: script
    file: "$SERVICE_PATH/scripts/fetch_provider_data"
    output:
      - name: K8S_NAMESPACE
        type: environment
      - name: ALB_NAME
        type: environment
  - name: "build context"
    type: script
    file: "$SERVICE_PATH/scripts/build_context"
    output:
      - name: SERVICE_ID
        type: environment
      - name: SERVICE_NAME
        type: environment
      - name: ACTION_ID
        type: environment
      - name: ACTION_NAME
        type: environment
      - name: LINK_ID
        type: environment
      - name: LINK_NAME
        type: environment
      - name: SCOPE_ID
        type: environment
      - name: RULE_PATH
        type: environment
  - name: "build_template"
    type: script
    file: "$SERVICE_PATH/scripts/build_ingress_without_rule"
    output:
      - name: INGRESS_FILE
        type: file
        file: "$OUTPUT_DIR/ingress-$SERVICE_ID-$SCOPE_ID-public.yaml"
  # build_template above removes the rule by the link's current path, which is
  # the wrong key whenever that path was renamed at some point: it would delete
  # nothing and leave the old rule serving. EXCLUDE_LINK_ID makes the removal
  # authoritative, by link rather than by path.
  - name: "prune_orphan_rules"
    type: script
    file: "$SERVICE_PATH/scripts/prune_orphan_rules"
    configuration:
      EXCLUDE_LINK_ID: "$LINK_ID"
  - name: apply
    type: script
    file: "$SERVICE_PATH/scripts/apply"
    configuration:
      ACTION: apply
      DRY_RUN: false
  - name: "add_rule_to_service"
    type: script
    file: "$SERVICE_PATH/scripts/update_service"
    configuration:
      ACTION: remove