steps:
  - name: "find k8s namespace"
    type: script
    file: "$SERVICE_PATH/scripts/fetch_provider_data"
    output:
      - name: K8S_NAMESPACE
        type: environment
      - name: ALB_NAME
        type: environment
  - name: "build context"
    type: script
    file: "$SERVICE_PATH/scripts/build_service_context"
    output:
      - name: SERVICE_ID
        type: environment
      - name: SERVICE_NAME
        type: environment
      - name: SERVICE_DOMAIN
        type: environment
      - name: ACTION_ID
        type: environment
      - name: ACTION_NAME
        type: environment
  - name: "lease"
    type: script
    file: "$SERVICE_PATH/scripts/lease"
    configuration:
      LEASE_ACTION: acquire
  - name: "restore_ingress"
    type: script
    file: "$SERVICE_PATH/scripts/restore_ingress"
    output:
      - name: REMOVED_PATHS
        type: environment
    post:
      name: wait ingress_reconciliation
      type: script
      file: "$SERVICE_PATH/scripts/verify_ingress_reconciliation"
      configuration:
        VERIFY_SCOPE: all
