steps:
  - name: build_tolerations
    type: script
    file: "$OVERRIDES_PATH/deployment/build_tolerations"
    after: build context
  - name: build_datadog_annotations
    type: script
    file: "$OVERRIDES_PATH/deployment/build_datadog_annotations"
    after: build_tolerations
  - name: build_datadog_environment
    type: script
    after: update blue deployment
    file: "$OVERRIDES_PATH/deployment/build_datadog_environment"
  - name: setup_node_affinity
    type: script
    after: setup_cloudwatch_logs
    file: "$OVERRIDES_PATH/deployment/node-affinity/build_node_affinity.sh"
  - name: sync_exposer
    type: script
    file: "$OVERRIDES_PATH/deployment/sync_exposer"
    before: delete deployment
    output:
      - name: CONTEXT
        type: environment
  - name: verify_unreferenced_versions
    type: script
    file: "$OVERRIDES_PATH/deployment/verify_unreferenced_versions"
    before: delete deployment
    configuration:
      VERSION_TO_KEEP: active
      REFERENCE_FIX_HINT: refresh
